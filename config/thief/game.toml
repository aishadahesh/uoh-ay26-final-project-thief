version = "1.10"

# Private, per-peer settings ONLY — never shared with, or read by, the cop
# process. See docs/tasks.md Chapter 2 ("Total Separation of Working
# Environments") and Appendix B (private vs. shared config files).

[game]
group_name = "uoh-ay26"
group_id = "uoh-ay26"
sub_game_number = 1
members = ["Aisha Abu Dahesh", "Yousef Asadi"]
repos = { cop = "https://github.com/aishadahesh/uoh-ay26-final-project-cop", thief = "https://github.com/aishadahesh/uoh-ay26-final-project-thief" }

[network]
my_port = 8802
opponent_url = "https://apps-mens-figured-spirituality.trycloudflare.com/mcp"
turn_timeout_seconds = 120

[strategy]
# Optional: point at YOUR brain subclass (else the shipped
# ManhattanHeuristicBrain heuristic runs -- see docs/PLAN.md ADR-010).
# thief_class = "my_team.strategy:MyThiefBrain"

[trash_talk]
# Optional: HOW the verbal bluff/hint text is produced.
# The MOVE decision is always pure Python (Sec. 6.4.1) -- this only
# affects hint phrasing. "template" (default) costs zero tokens.
provider = "template"

[llm]
model = "gemini-3.6-flash"
step_deadline_seconds = 30

[email]
# Gmail end-of-match reporting (Ch.9, Sec. 9.3.2-9.3.3).
# `recipient` is fixed by the rulebook's [agent's report address], never a
# per-team choice. Use dry_run until the real OAuth credentials.json/token.json
# setup is completed locally.
recipient = "rmisegal+uoh26finalgame@gmail.com"
mode = "dry_run"
