version = "1.10"

# NOT A SUBMISSION-GRADE CONFIG. This repository is the THIEF submission
# repo (see README.md). This file exists only so a single machine can run
# a local `cop` peer for interop/protocol testing (`serve --role cop`)
# against the real `thief` peer in this repo. The actual cop submission,
# and its authoritative private config, lives in the sibling cop repo.
#
# Private, per-peer settings ONLY — never shared with, or read by, the thief
# process. See docs/tasks.md Chapter 2 ("Total Separation of Working
# Environments") and Appendix B (private vs. shared config files).

[game]
group_name = "Local-Opponent"
group_id = "localcop"
sub_game_number = 1
members = ["Local Opponent", "Interop Test"]
repos = { cop = "https://github.com/aishadahesh/uoh-ay26-final-project-cop", thief = "https://github.com/aishadahesh/uoh-ay26-final-project-thief" }

[network]
my_port = 8801
opponent_url = "http://127.0.0.1:8802/mcp"
turn_timeout_seconds = 180

[strategy]
# Optional: point at YOUR brain subclass (else the shipped
# ManhattanHeuristicBrain heuristic runs -- see docs/PLAN.md ADR-010).
# cop_class = "my_team.strategy:MyCopBrain"

[trash_talk]
# Optional: HOW the verbal bluff/hint text is produced.
# The MOVE decision is always pure Python (Sec. 6.4.1) -- this only
# affects hint phrasing. "template" (default) costs zero tokens.
provider = "template"

[llm]
model = "gemini-3.6-flash"
step_deadline_seconds = 30

[email]
# Gmail end-of-match reporting (Ch.9, Sec. 9.3.2-9.3.3).
# Local opponent mode never sends official reports; keep dry_run.
recipient = "rmisegal+uoh26finalgame@gmail.com"
mode = "dry_run"
